services:
  postgres:
    image: postgres:17-alpine
    container_name: sagiton-postgres
    environment:
      POSTGRES_DB: sagiton
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sagiton"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: sagiton-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sagiton-backend
    environment:
      APP_PORT: 8080
      RUST_LOG: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sagiton
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
